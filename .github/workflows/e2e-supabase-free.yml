name: E2E — Supabase Free

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-supabase-free
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # Dedicated Supabase Free project only — never use production values here.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_E2E_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
      E2E_BASE_URL: http://127.0.0.1:3000
      E2E_ALLOW_REMOTE: "0"
      E2E_ALLOW_AUTO_PROVISION: "0"
      NOVA_E2E_MOCK: "1"
      IMPORT_E2E_MOCK: "1"
      CI: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Validate E2E configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${NEXT_PUBLIC_SUPABASE_URL}" || { echo "Missing SUPABASE_E2E_URL"; exit 1; }
          test -n "${NEXT_PUBLIC_SUPABASE_ANON_KEY}" || { echo "Missing SUPABASE_E2E_ANON_KEY"; exit 1; }
          test -n "${E2E_USER_EMAIL}" || { echo "Missing E2E_USER_EMAIL"; exit 1; }
          test -n "${E2E_USER_PASSWORD}" || { echo "Missing E2E_USER_PASSWORD"; exit 1; }
          SUPABASE_E2E_HOST="$(node -e 'console.log(new URL(process.env.NEXT_PUBLIC_SUPABASE_URL).hostname)')"
          test "${SUPABASE_E2E_HOST}" = "ozfbynbcmxzwzqklzqdj.supabase.co" || {
            echo "Refusing unexpected Supabase host"
            exit 1
          }

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: E2E audit
        run: npm run e2e:audit

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore